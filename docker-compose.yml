version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcc_tdah_organizer
      MYSQL_USER: api
      MYSQL_PASSWORD: api.Ristretto!123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: ./API
    container_name: java_api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tcc_tdah_organizer
      SPRING_DATASOURCE_USERNAME: api
      SPRING_DATASOURCE_PASSWORD: api.Ristretto!123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - default

volumes:
  mysql_data:
